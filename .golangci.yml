version: "2"
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  settings:
    staticcheck:
      # For now, we will disable some static checks to match golang-ci-lint@v1 functionality.
      # These should be addressed once the --new-from-rev work is taken care of.
      checks: ["all", "-QF1008", "-ST1003", "-ST1005"]
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      # We have a few patterns that are excluded from linting completely because
      # they contain effectively-frozen code that we're preserving for backward
      # compatibility, where changes would be risky and that risk isn't warranted
      # since we don't expect to be doing any significant maintenence on these.
      - ^internal/ipaddr/
      - ^internal/legacy/
      - ^internal/states/statefile/version\d+_upgrade\.go$
      - ^website/
formatters:
  # gofmt is enforced on everything Conn3x writes. The files below came from
  # OpenTofu unformatted; formatting them here would conflict with every
  # upstream change to them.
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: false # -s would rewrite 54 OpenTofu files
  exclusions:
    generated: lax
    paths:
      - ^internal/builtin/providers/tf/provider\.go$
      - ^internal/command/jsonprovider/provider(_test)?\.go$
      - ^internal/configs/test_file_test\.go$
      - ^internal/provider-simple(-v6)?/provider\.go$
