name: Feature request
description: Suggest something Conn3x should do.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How you picture it working. A config example helps a lot.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How you handle it now
      description: Workarounds, or how Terraform or Ansible handle it.
