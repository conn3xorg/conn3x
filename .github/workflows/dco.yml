name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  DCO:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Dependabot can't sign off; its changes are reviewed in the pull
      # request instead. The exemption goes by who opened the pull request,
      # which GitHub sets, not by a commit's author email, which anyone can.
      - name: Check Signed-off-by on every commit
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/dco-check.sh "$BASE" "$HEAD"
