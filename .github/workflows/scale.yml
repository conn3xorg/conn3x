name: Scale

# Plan and apply time at many hosts (#524), run by hand. The hosts are
# sshd-only containers (test/images/scale), so they measure Conn3x and SSH,
# not a real host's disk. Results are in the job summary and an artifact.
on:
  workflow_dispatch:
    inputs:
      hosts:
        description: Host counts, comma-separated
        default: "50,200,500"

permissions:
  contents: read

jobs:
  scale:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # crun makes a kernel keyring for every container, and an ordinary
      # user may hold only 200 keys by default.
      - name: Let one user hold a keyring per container
        run: sudo sysctl -w kernel.keys.maxkeys=20000 kernel.keys.maxbytes=4000000
      - name: Plan and apply at each host count
        env:
          CONN3X_SCALE: ${{ inputs.hosts }}
        run: |
          ulimit -n 65536 || true
          export CONN3X_SCALE_OUT="$RUNNER_TEMP/scale/scale.jsonl" CONN3X_SCALE_PROFILE="$RUNNER_TEMP/scale"
          mkdir -p "$RUNNER_TEMP/scale"
          go test -tags e2e -count=1 -timeout 110m -v -run '^TestScalePlan$' ./test/e2e/...
          {
            echo '| hosts | steps | apply (s) | plan (s) | plan -parallelism=50 (s) | plan -refresh=false (s) |'
            echo '| --- | --- | --- | --- | --- | --- |'
            jq -r '"| \(.hosts) | \(.steps) | \(.apply) | \(.plan) | \(.plan_parallelism_50) | \(.plan_refresh_false) |"' "$CONN3X_SCALE_OUT"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scale
          path: ${{ runner.temp }}/scale/
          if-no-files-found: ignore
