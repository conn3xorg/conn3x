name: Community dashboards

# Refreshes the help wanted, community PR and circuit health issues. The
# script only reads public data across the org and edits issues here.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refresh dashboards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dashboards.py
