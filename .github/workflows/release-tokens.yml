name: release-tokens

# The release preflight's checks, run weekly and on demand, so an expired
# tap or winget token shows up before release day.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'conn3xorg/conn3x'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: The tap token can write to the tap, the bucket and the packages site
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          for repo in homebrew-tap scoop-bucket packages; do
            gh api "repos/conn3xorg/$repo/git/blobs" -f content=preflight --silent \
              || { echo "HOMEBREW_TAP_TOKEN cannot write to conn3xorg/$repo" >&2; exit 1; }
          done
      - name: The winget token can write to the fork
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          gh api repos/jamesconwaydev/winget-pkgs/git/blobs -f content=preflight --silent \
            || { echo "WINGET_TOKEN cannot write to jamesconwaydev/winget-pkgs" >&2; exit 1; }
      - name: The packages key is set
        env:
          PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}
        run: |
          printf '%s\n' "$PACKAGES_GPG_KEY" | grep -q "BEGIN PGP PRIVATE KEY BLOCK" \
            || { echo "PACKAGES_GPG_KEY isn't an armored private key" >&2; exit 1; }
