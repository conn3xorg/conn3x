name: Release

# Cut a release: tag the current main, then build, sign, attest and upload
# everything as a draft GitHub release, which a maintainer publishes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v (for example 0.1.0)
        required: true

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || { echo "version must look like 0.1.0 or 0.2.0-rc.1" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Fail before tagging, so a bad tap token can't burn a version: tags
      # are protected and never deleted. An unreferenced blob changes nothing.
      - name: Check the tap token can write
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh api repos/conn3xorg/homebrew-tap/git/blobs -f content=preflight --silent \
            || { echo "HOMEBREW_TAP_TOKEN cannot write to conn3xorg/homebrew-tap" >&2; exit 1; }
      - name: Tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA"
          git fetch --tags origin
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A release is built from the checkout and the module proxy only,
          # never from a build cache that an earlier run left behind.
          cache: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # An exact version, like every action here: the tool that builds
          # the release shouldn't change on its own between two releases.
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
      # The attestation also lives in GitHub's attestation store; attaching
      # it to the release lets anyone verify offline, and lets OpenSSF
      # Scorecard see provenance (it looks for *.intoto.jsonl assets).
      - name: Attach provenance to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "conn3x_${VERSION}.intoto.jsonl"
          gh release upload "v$VERSION" "conn3x_${VERSION}.intoto.jsonl" --repo "$GITHUB_REPOSITORY"
