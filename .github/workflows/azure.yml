name: Azure

# Creates a billable Windows VM, so it runs only by hand or weekly, never for
# pull requests. It logs in with OIDC: there's no secret to leak. The test
# deletes its own resource group, and azure-sweep.yml catches any left behind.
on:
  schedule:
    - cron: "45 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure
  cancel-in-progress: false

jobs:
  windows-example:
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: azure
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build
        run: go build -o conn3x ./cmd/conn3x
      - name: One plan for a Windows VM and its configuration
        env:
          CONN3X_BIN: ./conn3x
        run: go test -tags azure -count=1 -timeout 70m -v -run '^TestExample$' ./test/azure/
