name: Sweep Azure test groups

# Deletes test resource groups older than four hours, so a failed run can't
# leave a VM running for long. See test/azure/sweep.sh for what it may touch.
on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: azure
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sweep
        run: bash test/azure/sweep.sh 4
