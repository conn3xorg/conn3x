name: Sweep test droplets

# Deletes conn3x-ci droplets older than two hours and their SSH keys, so a
# failed run can never leave anything running for long.
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    # A fork has none of the credentials this needs.
    if: github.repository == 'conn3xorg/conn3x'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Sweep
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: go run ./test/droplet/sweep -max-age 2h
