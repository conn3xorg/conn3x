name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The action downloads golangci-lint from GitHub releases on every run,
      # and those downloads failed for hours on 8 Nov. Keep the binary in the
      # Actions cache instead, and on a miss build it through the Go module
      # proxy rather than github.com (#575).
      - name: Restore golangci-lint
        id: golangci
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/golangci-lint
          key: golangci-lint-v2.14.0-${{ runner.os }}-${{ runner.arch }}
      - name: Build golangci-lint
        if: steps.golangci.outputs.cache-hit != 'true'
        run: GOBIN=$HOME/.local/golangci-lint go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: echo "$HOME/.local/golangci-lint" >> "$GITHUB_PATH"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none
          args: ./internal/conn3x/... ./cmd/conn3x/... ./cmd/conn3x-agent/...
      - name: Upstream edits stay marked and within budget
        run: bash scripts/upstream/hook-budget.sh "$(cat internal/conn3x/version/UPSTREAM)" 7
      - name: Script tests
        run: |
          bash scripts/upstream/sync_test.sh
          bash scripts/upstream/commit_payload_test.sh
          bash scripts/upstream/hook-budget_test.sh
          bash scripts/dco-check_test.sh
          bash scripts/no-binaries_test.sh
          bash scripts/build-agent_test.sh
          python3 scripts/dashboards_test.py
      - name: No executables or oversized files added
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch -q --depth=1 origin "$BASE"
          bash scripts/no-binaries.sh "$BASE" HEAD
      - name: Real-host test helpers
        run: go test ./test/droplet/... ./test/azure/...

  # A plan must change nothing on a Windows host, and a value must never become
  # code. The parser in pwsh checks that; the runner has pwsh preinstalled.
  windows-script-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scripts follow the rules
        shell: bash
        run: pwsh -NoProfile -File scripts/ps-rules.ps1 internal/conn3x/modules/windows/*.ps1 internal/conn3x/modules/windows/lib/*.ps1
      - name: Scripts that break a rule are caught
        shell: bash
        run: |
          # Each fixture names the problem it must be caught for: any other
          # failure, even a crash in the checker, would prove nothing.
          for f in internal/conn3x/modules/windows/testdata/bad/*.ps1; do
            want=$(sed -n 's/^# expect: //p' "$f")
            if [ -z "$want" ]; then
              echo "$f has no '# expect:' line" >&2
              exit 1
            fi
            rc=0
            out=$(pwsh -NoProfile -File scripts/ps-rules.ps1 "$f") || rc=$?
            if [ "$rc" -ne 1 ]; then
              echo "$f: exit $rc, want 1" >&2
              echo "$out" >&2
              exit 1
            fi
            case "$out" in
              *"$want"*) ;;
              *)
                echo "$f wasn't caught for: $want" >&2
                echo "$out" >&2
                exit 1
                ;;
            esac
          done

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Nightly runs and upstream sync PRs run OpenTofu's full suite.
          if [ "$EVENT" = "schedule" ] || [[ "$HEAD_REF" == chore/sync-opentofu-* ]]; then
            go test ./...
          else
            go test ./internal/conn3x/... ./cmd/conn3x/... ./internal/dag/... ./internal/configs/... ./internal/addrs/...
            go test -run Conn3x ./internal/tofu/
            go test -run TestTest_Idempotent ./internal/command/
          fi

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          scripts/build-conn3x.sh dist/conn3x -ldflags='-s -w'
          go build -trimpath -ldflags='-s -w' -o dist/tofu ./cmd/tofu
          ./dist/conn3x version
          scripts/brand-check.sh dist/conn3x
      - name: The build embeds the agents
        run: CONN3X_REQUIRE_AGENT=1 go test -count=1 -run TestEmbeddedPresent ./internal/conn3x/agent/
      - name: The version names the agents
        run: |
          ./dist/conn3x version | grep -E '^agent: linux/amd64 [0-9a-f]{12}, linux/arm64 [0-9a-f]{12}$' \
            || { echo "conn3x version has no agent line" >&2; exit 1; }
      # The embedded host agents are a separate program conn3x carries for
      # hosts; the CLI itself must stay smaller than the tofu it's built from.
      - name: Stay smaller than tofu, not counting the embedded agents
        run: |
          c=$(stat -c %s dist/conn3x)
          a=$(cat internal/conn3x/agent/payload/conn3x-agent-* | wc -c)
          t=$(stat -c %s dist/tofu)
          echo "conn3x $((c / 1000000)) MB (agents $((a / 1000)) KB), tofu $((t / 1000000)) MB"
          [ "$a" -gt 0 ] || { echo "found no embedded agents to subtract" >&2; exit 1; }
          [ $((c - a)) -lt "$t" ] || { echo "conn3x without its agents has grown past the tofu it is built from" >&2; exit 1; }
      - name: Cross-compile for the release targets
        run: |
          for target in linux/arm64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} scripts/build-conn3x.sh "dist/conn3x-${target%/*}-${target#*/}" -ldflags='-s -w'
          done

  # conn3x.exe runs on a Windows machine and reaches the SSH agent there,
  # which listens on a named pipe rather than a Unix socket.
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build and run conn3x.exe
        run: |
          go build -trimpath -o conn3x.exe ./cmd/conn3x
          ./conn3x.exe version
      - name: SSH agent over a named pipe
        run: go test -count=1 -run TestDialAgent ./internal/conn3x/transport/ssh/

  e2e-hosts:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        agent: ["off", "require"]
        shard: [0, 1, 2]
    name: e2e (agent ${{ matrix.agent }}, ${{ matrix.shard }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The examples' init downloads every provider. With their lock files and
      # a cache kept between runs, a package already here isn't fetched
      # again, so a slow or failing github.com doesn't fail the run.
      - name: Provider plugin cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/conn3x-plugins
          key: providers-${{ runner.os }}-${{ hashFiles('examples/**/.terraform.lock.hcl') }}
          restore-keys: providers-${{ runner.os }}-
      # The runner image ships MySQL, and its AppArmor profile attaches by
      # path to /usr/sbin/mysqld in the test containers too. There it stops
      # the postinst from stopping its own mysqld, so the install never
      # returns.
      - name: Unload the runner's mysqld AppArmor profile
        run: |
          if sudo aa-status 2>/dev/null | grep -q mysqld; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld
          fi
          sudo aa-status 2>/dev/null | grep mysqld || echo "no mysqld profile loaded"
      # "require" fails an apply that can't use the agent, so the on leg
      # proves every non-become host ran its commands through it.
      - name: End-to-end tests against Podman hosts
        env:
          CONN3X_AGENT: ${{ matrix.agent }}
        run: |
          podman --version
          mkdir -p ~/.cache/conn3x-plugins
          export TF_PLUGIN_CACHE_DIR=~/.cache/conn3x-plugins
          # The tests run one at a time, 20 to 26 minutes in all, and twice
          # that when package mirrors are slow. So each job takes every third
          # test by name.
          tests=$(sed -nE 's/^func (Test[A-Za-z0-9_]+)\(t \*testing\.T\).*/\1/p' test/e2e/*_test.go | sort | awk -v i=${{ matrix.shard }} '(NR - 1) % 3 == i' | paste -sd '|' -)
          echo "shard ${{ matrix.shard }}: ${tests//|/ }"
          go test -tags e2e -count=1 -timeout 45m -v -run "^(${tests})\$" ./test/e2e/...

  # The required check: every shard passed in both agent modes.
  e2e:
    if: always()
    needs: e2e-hosts
    runs-on: ubuntu-24.04
    steps:
      - name: Every shard passed in both agent modes
        env:
          RESULT: ${{ needs.e2e-hosts.result }}
        run: '[ "$RESULT" = success ] || { echo "e2e: $RESULT" >&2; exit 1; }'
