name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The action downloads golangci-lint from GitHub releases on every run,
      # and those downloads failed for hours on 8 Nov. Keep the binary in the
      # Actions cache instead, and on a miss build it through the Go module
      # proxy rather than github.com (#575).
      - name: Restore golangci-lint
        id: golangci
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/golangci-lint
          key: golangci-lint-v2.14.0-${{ runner.os }}-${{ runner.arch }}
      - name: Build golangci-lint
        if: steps.golangci.outputs.cache-hit != 'true'
        run: GOBIN=$HOME/.local/golangci-lint go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: echo "$HOME/.local/golangci-lint" >> "$GITHUB_PATH"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none
          args: ./internal/conn3x/... ./cmd/conn3x/... ./cmd/conn3x-agent/...
      # gofmt on everything Conn3x writes. .golangci.yml came from OpenTofu,
      # so the check lives here rather than as a linter formatter there.
      - name: Conn3x's Go is gofmt-formatted
        run: |
          out=$(gofmt -l internal/conn3x cmd/conn3x cmd/conn3x-agent test)
          [ -z "$out" ] || { echo "gofmt would change:"; echo "$out"; exit 1; } >&2
      - name: Upstream edits stay marked and within budget
        run: bash scripts/upstream/hook-budget.sh "$(cat internal/conn3x/version/UPSTREAM)" 9
      - name: Script tests
        run: |
          bash scripts/upstream/sync_test.sh
          bash scripts/upstream/commit_payload_test.sh
          bash scripts/upstream/hook-budget_test.sh
          bash scripts/dco-check_test.sh
          bash scripts/no-binaries_test.sh
          bash scripts/build-agent_test.sh
          bash scripts/stable-channel_test.sh
          python3 scripts/dashboards_test.py
          python3 scripts/advisory_watch_test.py
      - name: No executables or oversized files added
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch -q --depth=1 origin "$BASE"
          bash scripts/no-binaries.sh "$BASE" HEAD
      - name: Real-host test helpers
        run: go test ./test/droplet/... ./test/azure/...

  # A plan must change nothing on a Windows host, and a value must never become
  # code. The parser in pwsh checks that; the runner has pwsh preinstalled.
  windows-script-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scripts follow the rules
        shell: bash
        run: pwsh -NoProfile -File scripts/ps-rules.ps1 internal/conn3x/modules/windows/*.ps1 internal/conn3x/modules/windows/lib/*.ps1
      - name: Scripts that break a rule are caught
        shell: bash
        run: |
          # Each fixture names the problem it must be caught for: any other
          # failure, even a crash in the checker, would prove nothing.
          for f in internal/conn3x/modules/windows/testdata/bad/*.ps1; do
            want=$(sed -n 's/^# expect: //p' "$f")
            if [ -z "$want" ]; then
              echo "$f has no '# expect:' line" >&2
              exit 1
            fi
            rc=0
            out=$(pwsh -NoProfile -File scripts/ps-rules.ps1 "$f") || rc=$?
            if [ "$rc" -ne 1 ]; then
              echo "$f: exit $rc, want 1" >&2
              echo "$out" >&2
              exit 1
            fi
            case "$out" in
              *"$want"*) ;;
              *)
                echo "$f wasn't caught for: $want" >&2
                echo "$out" >&2
                exit 1
                ;;
            esac
          done

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Test
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Nightly runs and upstream sync PRs run OpenTofu's full suite.
          if [ "$EVENT" = "schedule" ] || [[ "$HEAD_REF" == chore/sync-opentofu-* ]]; then
            go test ./...
          else
            go test ./internal/conn3x/... ./cmd/conn3x/... ./internal/dag/... ./internal/configs/... ./internal/addrs/...
            go test -run Conn3x ./internal/tofu/
            go test -run TestTest_Idempotent ./internal/command/
          fi
      - name: Test Conn3x's own packages with the race detector
        # Nightly only: it triples the time, and a race rarely hides from
        # a run a day. Twice in one process and shuffled, so a test that
        # leaves state behind for the next one fails here too.
        if: github.event_name == 'schedule'
        run: go test -race -count=2 -shuffle=on ./internal/conn3x/... ./cmd/conn3x/...
      - name: Test as root
        # bash, for pipefail: a failed test mustn't hide behind tee.
        shell: bash
        run: |
          # What root does on a path another account can write is tested
          # only as root: without it these packages skip those tests. The
          # packages are the ones with a test that asks for root.
          pkgs=$(grep -rlE 'moduletest\.RootDir|needs root' --include='*_test.go' internal/conn3x | xargs -n1 dirname | sort -u)
          [ -n "$pkgs" ] || { echo "no package has a test that needs root" >&2; exit 1; }
          for p in $pkgs; do
            echo "::group::$p"
            # No binary is written for a package without tests: don't run the last one again.
            rm -f /tmp/root.test
            (cd "$p" && go test -c -o /tmp/root.test . && sudo env "PATH=$PATH" /tmp/root.test -test.count=1 -test.v) | tee /tmp/root.out
            echo "::endgroup::"
            # A skipped test that printed "needs root", not any line with those words.
            skipped=$(go tool test2json </tmp/root.out | jq -rs '
              ([.[] | select(.Action == "skip") | .Test]) as $skips
              | [.[] | select(.Action == "output" and (.Output | test("needs root"))) | .Test | select(. as $t | $skips | index($t))]
              | unique | .[]')
            if [ -n "$skipped" ]; then
              echo "$p skipped tests that need root: $skipped" >&2
              exit 1
            fi
          done

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          scripts/build-conn3x.sh dist/conn3x -ldflags='-s -w'
          go build -trimpath -ldflags='-s -w' -o dist/tofu ./cmd/tofu
          ./dist/conn3x version
          scripts/brand-check.sh dist/conn3x
      - name: The build embeds the agents
        run: CONN3X_REQUIRE_AGENT=1 go test -count=1 -run TestEmbeddedPresent ./internal/conn3x/agent/
      - name: The version names the agents
        run: |
          ./dist/conn3x version | grep -E '^agent: linux/amd64 [0-9a-f]{12}, linux/arm64 [0-9a-f]{12}$' \
            || { echo "conn3x version has no agent line" >&2; exit 1; }
      # The embedded host agents are a separate program conn3x carries for
      # hosts. The CLI is tofu plus Conn3x's own steps, so it may be bigger
      # than the tofu it's built from, but by no more than a fixed budget:
      # growth past it needs a look, not a quiet bump.
      - name: Stay within 3 MB of tofu, not counting the embedded agents
        run: |
          c=$(stat -c %s dist/conn3x)
          a=$(cat internal/conn3x/agent/payload/conn3x-agent-* | wc -c)
          t=$(stat -c %s dist/tofu)
          budget=3000000
          over=$((c - a - t))
          echo "conn3x $((c / 1000000)) MB (agents $((a / 1000)) KB), tofu $((t / 1000000)) MB; without agents it's $((over / 1000)) KB over tofu, of a $((budget / 1000)) KB budget"
          [ "$a" -gt 0 ] || { echo "found no embedded agents to subtract" >&2; exit 1; }
          [ "$over" -le "$budget" ] || { echo "conn3x without its agents is more than $((budget / 1000)) KB bigger than the tofu it is built from" >&2; exit 1; }
      - name: Cross-compile for the release targets
        run: |
          for target in linux/arm64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} scripts/build-conn3x.sh "dist/conn3x-${target%/*}-${target#*/}" -ldflags='-s -w'
          done

  # conn3x.exe runs on a Windows machine and reaches the SSH agent there,
  # which listens on a named pipe rather than a Unix socket.
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build and run conn3x.exe
        run: |
          go build -trimpath -o conn3x.exe ./cmd/conn3x
          ./conn3x.exe version
      - name: SSH agent over a named pipe
        run: go test -count=1 -run TestDialAgent ./internal/conn3x/transport/ssh/

  e2e-hosts:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        agent: ["off", "require"]
        shard: [0, 1, 2]
    name: e2e (agent ${{ matrix.agent }}, ${{ matrix.shard }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The examples' init downloads every provider. With their lock files and
      # a cache kept between runs, a package already here isn't fetched
      # again, so a slow or failing github.com doesn't fail the run.
      - name: Provider plugin cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/conn3x-plugins
          key: providers-${{ runner.os }}-${{ hashFiles('examples/**/.terraform.lock.hcl') }}
          restore-keys: providers-${{ runner.os }}-
      # The runner image ships MySQL, and its AppArmor profile attaches by
      # path to /usr/sbin/mysqld in the test containers too. There it stops
      # the postinst from stopping its own mysqld, so the install never
      # returns.
      - name: Unload the runner's mysqld AppArmor profile
        run: |
          if sudo aa-status 2>/dev/null | grep -q mysqld; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld
          fi
          sudo aa-status 2>/dev/null | grep mysqld || echo "no mysqld profile loaded"
      # "require" fails an apply that can't use the agent, so the on leg
      # proves every non-become host ran its commands through it.
      - name: End-to-end tests against Podman hosts
        env:
          CONN3X_AGENT: ${{ matrix.agent }}
          COVER: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          podman --version
          # Nightly and on request, conn3x is built with -cover and every run
          # of it writes its counters for the coverage job.
          if [ "$COVER" = true ]; then
            export CONN3X_E2E_BUILD_FLAGS="-cover -coverpkg=./internal/conn3x/...,./cmd/conn3x/..."
            export GOCOVERDIR="$RUNNER_TEMP/covdata"
            mkdir -p "$GOCOVERDIR"
          fi
          mkdir -p ~/.cache/conn3x-plugins
          export TF_PLUGIN_CACHE_DIR=~/.cache/conn3x-plugins
          # The tests run one at a time, 20 to 26 minutes in all, and twice
          # that when package mirrors are slow. So each job takes every third
          # test by name.
          tests=$(sed -nE 's/^func (Test[A-Za-z0-9_]+)\(t \*testing\.T\).*/\1/p' test/e2e/*_test.go | sort | awk -v i=${{ matrix.shard }} '(NR - 1) % 3 == i' | paste -sd '|' -)
          echo "shard ${{ matrix.shard }}: ${tests//|/ }"
          go test -tags e2e -count=1 -timeout 45m -v -run "^(${tests})\$" ./test/e2e/...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          name: covdata-e2e-${{ matrix.agent }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/covdata
          retention-days: 3

  # The required check: every shard passed in both agent modes.
  e2e:
    if: always()
    needs: e2e-hosts
    runs-on: ubuntu-24.04
    steps:
      - name: Every shard passed in both agent modes
        env:
          RESULT: ${{ needs.e2e-hosts.result }}
        run: '[ "$RESULT" = success ] || { echo "e2e: $RESULT" >&2; exit 1; }'

  # The Windows host tests, built with -cover, for the coverage job.
  windows-cover:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/windows.yml
    with:
      cover: true

  # One statement-coverage number for Conn3x's own packages, counting the
  # unit tests, every e2e shard's runs of the -cover build and the Windows
  # host tests. Nightly and on request only; it reports and doesn't gate.
  coverage:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [e2e-hosts, windows-cover]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: covdata-*
          path: ${{ runner.temp }}/covdata/e2e
      - name: Unit tests with coverage
        run: |
          mkdir -p "$RUNNER_TEMP/covdata/unit"
          go test -cover -coverpkg=./internal/conn3x/...,./cmd/conn3x/...,./cmd/conn3x-agent/... \
            ./internal/conn3x/... ./cmd/conn3x/... ./cmd/conn3x-agent/... \
            -args -test.gocoverdir="$RUNNER_TEMP/covdata/unit"
          # go test writes nothing for a main package with no tests, so its
          # statements would drop out of the total. Run each once, as the
          # build and a host do, so they count.
          go build -cover -o "$RUNNER_TEMP/agent" ./cmd/conn3x-agent
          GOCOVERDIR="$RUNNER_TEMP/covdata/unit" "$RUNNER_TEMP/agent" </dev/null
          go build -cover -o "$RUNNER_TEMP/brandgen" ./internal/conn3x/brand/brandgen
          GOCOVERDIR="$RUNNER_TEMP/covdata/unit" "$RUNNER_TEMP/brandgen" -root . -out "$(mktemp -d)" >/dev/null
      - name: Merge and report
        run: |
          d=$RUNNER_TEMP/covdata
          shards=$(find "$d/e2e" -mindepth 1 -maxdepth 1 -type d | wc -l)
          [ "$shards" -eq 8 ] || { echo "found $shards runs' coverage, want 8: 6 e2e shards and 2 Windows" >&2; exit 1; }
          mkdir -p "$d/merged"
          go tool covdata merge -i="$({ echo "$d/unit"; find "$d/e2e" -mindepth 1 -maxdepth 1 -type d; } | paste -sd, -)" -o="$d/merged"
          go tool covdata textfmt -i="$d/merged" -o=coverage.out
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $NF}')
          [ -n "$total" ] || { echo "no total in coverage.out" >&2; exit 1; }
          echo "Statement coverage: $total"
          {
            echo "## Statement coverage: $total"
            echo
            echo "Unit tests, the e2e runs in both agent modes, and the Windows host tests on Server 2022 and 2025, over \`./internal/conn3x/...\`, \`./cmd/conn3x/...\` and \`./cmd/conn3x-agent/...\`."
            echo
            echo "| Package | Statements covered |"
            echo "| --- | --- |"
            go tool covdata percent -i="$d/merged" | awk '{sub("github.com/opentofu/opentofu/", "", $1); print "| `" $1 "` | " $3 " |"}'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

  # Branch coverage of Conn3x's own packages, for the OpenSSF gold
  # criterion test_branch_coverage80. Go measures statements only, so gobco
  # instruments each package and runs its unit tests. It can't see the e2e
  # runs or one package's tests reaching another, so this undercounts next
  # to the statement number above. Nightly and on request; it doesn't gate.
  branch-coverage:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install gobco
        run: go install github.com/rillig/gobco@v1.3.4
      - name: Branch coverage of the unit tests
        run: |
          pkgs="./internal/conn3x/... ./cmd/conn3x/... ./cmd/conn3x-agent/..."
          mod=$(go list -m)
          out=$RUNNER_TEMP/gobco
          mkdir -p "$out"
          # gobco 1.3.4 type-checks every file in a directory, even those
          # build constraints leave out, and panics on the names they
          # declare twice (rillig/gobco#40). This checkout is thrown away.
          # shellcheck disable=SC2086
          go list -f '{{.Dir}}{{range .IgnoredGoFiles}} {{.}}{{end}}' $pkgs |
            awk 'NF > 1 { for (i = 2; i <= NF; i++) print $1 "/" $i }' | xargs -r rm -v
          # One package per run: gobco takes no more.
          # shellcheck disable=SC2086
          go list $pkgs | sed "s|^$mod/||" > "$out/pkgs"
          # shellcheck disable=SC2016
          xargs -P "$(nproc)" -I{} sh -c 'f="$2/$(echo "$1" | tr / _).log"; gobco -branch "./$1" > "$f" 2>&1 || echo "gobco exit $?" >> "$f"' _ {} "$out" < "$out/pkgs"
          while read -r p; do
            f=$out/$(echo "$p" | tr / _).log
            r=$(sed -nE 's|^Branch coverage: ([0-9]+)/([0-9]+)$|\1 \2|p' "$f")
            note=
            grep -q '^gobco exit' "$f" && note="tests failed"
            if [ -z "$r" ]; then
              r="0 0" note="no result"
              echo "::warning::gobco gave no result for $p"
              tail -n 20 "$f"
            fi
            echo "$p $r $note"
          done < "$out/pkgs" > "$out/rows"
          total=$(awk '{ c += $2; t += $3 } END { if (t) printf "%.1f%% (%d of %d)", 100 * c / t, c, t }' "$out/rows")
          [ -n "$total" ] || { echo "no branches counted" >&2; exit 1; }
          echo "Branch coverage: $total"
          {
            echo "## Branch coverage: $total"
            echo
            echo "gobco 1.3.4 \`-branch\` over the unit tests of \`./internal/conn3x/...\`, \`./cmd/conn3x/...\` and \`./cmd/conn3x-agent/...\`, each package by its own tests. The e2e and Windows host runs aren't counted. Most uncovered first."
            echo
            echo "| Package | Branches covered | Uncovered | Note |"
            echo "| --- | --- | --- | --- |"
            awk '{ note = ""; for (i = 4; i <= NF; i++) note = note (i > 4 ? " " : "") $i
                   pct = $3 ? sprintf("%.1f%%", 100 * $2 / $3) : "n/a"
                   printf "%d\t| `%s` | %d of %d (%s) | %d | %s |\n", $3 - $2, $1, $2, $3, pct, $3 - $2, note }' "$out/rows" |
              sort -t "$(printf '\t')" -k1,1nr | cut -f2-
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: branch-coverage
          path: ${{ runner.temp }}/gobco
          retention-days: 7
