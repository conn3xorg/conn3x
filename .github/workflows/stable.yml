name: Stable channel

# Points the image tag "stable" and the cask conn3x@stable at a release
# that has been out for a week with every published fix in it. Nothing is
# built: scripts/stable-channel.sh has the rule. Run it by hand with a
# version to promote a security fix the day it ships.
on:
  schedule:
    # Tuesday's run is a backup for a Monday run GitHub dropped (it missed
    # on 16 Nov), and does nothing when Monday's succeeded.
    - cron: "40 9 * * 1"
    - cron: "40 9 * * 2"
  workflow_dispatch:
    inputs:
      version:
        description: Release to make stable, without the v. Empty picks by the rule.
        required: false

permissions:
  contents: read

concurrency:
  group: stable
  cancel-in-progress: false

jobs:
  stable:
    if: github.ref == 'refs/heads/main' && github.repository == 'conn3xorg/conn3x'
    runs-on: ubuntu-24.04
    # The tap token lives in the main-only release environment.
    environment: release
    timeout-minutes: 10
    permissions:
      actions: read # Tuesday's check for Monday's run
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Monday's run already moved it
        id: done
        if: github.event.schedule == '40 9 * * 2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '30 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w stable.yml -s success --created ">$since" --json databaseId --jq length)
          echo "skip=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Move stable
        if: steps.done.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: bash scripts/stable-channel.sh ${VERSION:+"$VERSION"}
