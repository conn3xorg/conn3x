name: Release dry run

on:
  pull_request:
    paths:
      - .goreleaser.yaml
      - release.Containerfile
      - scripts/build-conn3x.sh
      - scripts/build-agent.sh
      - scripts/sign-tag.sh
      - internal/conn3x/agent/payload/**
      - internal/conn3x/agent/payload.go
      - cmd/conn3x-agent/**
      - cmd/conn3x/conn3x_brand.go
      - internal/conn3x/brand/**
      - .github/workflows/release*.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # the signed tag check below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # An exact version, like every action here: the tool that builds
          # the release shouldn't change on its own between two releases.
          version: v2.20.0
          args: release --snapshot --clean --skip=sign
      - name: The release binary is branded and runs
        run: |
          tar -xzf dist/conn3x_*_linux_amd64.tar.gz conn3x
          ./conn3x version | tee version.txt
          scripts/brand-check.sh ./conn3x
      # The .deb holds the archive's binary, installs it on the PATH, and
      # its SBOM lists the modules in it, not just the package.
      - name: The .deb installs the release binary
        run: |
          sudo apt-get install -y ./dist/conn3x_*_amd64.deb
          cmp /usr/bin/conn3x ./conn3x
          /usr/bin/conn3x version
          sudo apt-get remove -y conn3x
          test ! -e /usr/bin/conn3x
          for sbom in dist/*.deb.sbom.json dist/*.rpm.sbom.json; do
            n=$(jq '.packages | length' "$sbom")
            [ "$n" -gt 100 ] || { echo "$sbom lists $n packages" >&2; exit 1; }
          done
      - name: The release binary embeds both agents
        run: |
          grep -Eq '^agent: linux/amd64 [0-9a-f]{12}, linux/arm64 [0-9a-f]{12}$' version.txt \
            || { echo "the release binary has no agents" >&2; exit 1; }
      # Another path and an empty build cache must give the same bytes the
      # release embedded, or nobody can check the agent against its source.
      - name: The agents build reproducibly
        run: |
          git worktree add --detach "$RUNNER_TEMP/again" HEAD
          GOCACHE="$RUNNER_TEMP/gocache" bash "$RUNNER_TEMP/again/scripts/build-agent.sh" "$RUNNER_TEMP/agents"
          for arch in amd64 arm64; do
            f=conn3x-agent-linux-$arch.gz
            sha256sum "internal/conn3x/agent/payload/$f" "$RUNNER_TEMP/agents/$f"
            cmp -s "internal/conn3x/agent/payload/$f" "$RUNNER_TEMP/agents/$f" \
              || { echo "linux/$arch agent differs between builds" >&2; exit 1; }
          done
      # The release binary itself, built again from another checkout with an
      # empty cache, must come out byte for byte the same, so anyone can
      # check a release against its source.
      - name: The release binary builds reproducibly
        run: |
          v=$(jq -r .version dist/metadata.json)
          git worktree add --detach "$RUNNER_TEMP/rebuild" HEAD
          cd "$RUNNER_TEMP/rebuild"
          GOCACHE="$RUNNER_TEMP/gocache-rebuild" CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            bash scripts/build-conn3x.sh "$RUNNER_TEMP/conn3x-rebuild" \
            -ldflags "-s -w -X github.com/opentofu/opentofu/internal/conn3x/version.Version=$v -X github.com/opentofu/opentofu/version.dev=no"
          cd "$GITHUB_WORKSPACE"
          sha256sum ./conn3x "$RUNNER_TEMP/conn3x-rebuild"
          cmp -s ./conn3x "$RUNNER_TEMP/conn3x-rebuild" \
            || { echo "the release binary differs between builds" >&2; exit 1; }
      # The release signs its tag with gitsign. Sign one here the same way,
      # with this workflow's identity, and check it; it's never pushed. A
      # fork's pull request gets no OIDC token, so it skips this.
      - name: The release tag can be signed and verified
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/sigstore/gitsign@v0.18.0
          PATH="$RUNNER_TEMP/bin:$PATH" scripts/sign-tag.sh v0.0.0-dry-run HEAD \
            "^https://github.com/$GITHUB_REPOSITORY/\.github/workflows/release-dry-run\.yml@refs/pull/"
          git tag -d v0.0.0-dry-run
