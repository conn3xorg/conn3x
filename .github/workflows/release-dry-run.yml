name: Release dry run

on:
  pull_request:
    paths:
      - .goreleaser.yaml
      - release.Containerfile
      - scripts/build-conn3x.sh
      - scripts/build-agent.sh
      - internal/conn3x/agent/payload/**
      - internal/conn3x/agent/payload.go
      - cmd/conn3x-agent/**
      - cmd/conn3x/conn3x_brand.go
      - internal/conn3x/brand/**
      - .github/workflows/release*.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign
      - name: The release binary is branded and runs
        run: |
          tar -xzf dist/conn3x_*_linux_amd64.tar.gz conn3x
          ./conn3x version | tee version.txt
          scripts/brand-check.sh ./conn3x
      - name: The release binary embeds both agents
        run: |
          grep -Eq '^agent: linux/amd64 [0-9a-f]{12}, linux/arm64 [0-9a-f]{12}$' version.txt \
            || { echo "the release binary has no agents" >&2; exit 1; }
      # Another path and an empty build cache must give the same bytes the
      # release embedded, or nobody can check the agent against its source.
      - name: The agents build reproducibly
        run: |
          git worktree add --detach "$RUNNER_TEMP/again" HEAD
          GOCACHE="$RUNNER_TEMP/gocache" bash "$RUNNER_TEMP/again/scripts/build-agent.sh" "$RUNNER_TEMP/agents"
          for arch in amd64 arm64; do
            f=conn3x-agent-linux-$arch.gz
            sha256sum "internal/conn3x/agent/payload/$f" "$RUNNER_TEMP/agents/$f"
            cmp -s "internal/conn3x/agent/payload/$f" "$RUNNER_TEMP/agents/$f" \
              || { echo "linux/$arch agent differs between builds" >&2; exit 1; }
          done
