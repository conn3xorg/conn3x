name: packages

# Publishes the apt and dnf repositories on conn3xorg/packages' Pages once
# a release is published (#684). A maintainer publishes the draft the
# release job makes, so this checks every hour, from main, whether the
# site is behind the latest release, and builds it again when it is.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'conn3xorg/conn3x'
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Is the site behind the latest release?
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST_SIGNED: v0.20.0
        run: |
          latest=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --exclude-drafts --limit 1 --json tagName -q '.[0].tagName')
          have=$(curl -fsS https://conn3xorg.github.io/packages/version 2>/dev/null || true)
          echo "latest=$latest have=$have"
          # Packages are signed from v0.20.0 on; the repo file has
          # gpgcheck=1, so nothing older goes in.
          if [ "$(printf '%s\n' "$FIRST_SIGNED" "$latest" | sort -V | head -1)" != "$FIRST_SIGNED" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$latest" = "$have" ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.latest.outputs.publish == 'true'
        with:
          persist-credentials: false
      - name: Build and push the site
        if: steps.latest.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q apt-utils createrepo-c
          # The key has no passphrase: it lives only in the release
          # environment's secrets, which only main can read.
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$PACKAGES_GPG_KEY" | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          export GPG_KEY_ID
          mapfile -t all < <(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --exclude-drafts --limit 2 --json tagName -q '.[].tagName')
          tags=()
          for t in "${all[@]}"; do
            if [ "$(printf '%s\n' v0.20.0 "$t" | sort -V | head -1)" = v0.20.0 ]; then tags+=("$t"); fi
          done
          site="$RUNNER_TEMP/site"
          scripts/publish-packages.sh "$site" "${tags[@]}"
          printf '%s' "${tags[0]}" > "$site/version"
          cd "$site"
          git init -q -b gh-pages
          git -c user.name="conn3x packages" -c user.email="packages@conn3x.org" add -A
          git -c user.name="conn3x packages" -c user.email="packages@conn3x.org" commit -q -m "Packages for ${tags[0]}"
          git push -q --force "https://x-access-token:${PUSH_TOKEN}@github.com/conn3xorg/packages.git" gh-pages
