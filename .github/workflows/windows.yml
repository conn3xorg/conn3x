name: Windows

# Real PowerShell over real sshd, on GitHub's runner. No reboots: a runner can't
# survive them; those run against a VM by hand.
on:
  pull_request:
    paths:
      - internal/conn3x/modules/windows/**
      - internal/conn3x/transport/ssh/**
      - internal/conn3x/provider/windows_*.go
      - internal/conn3x/provider/host_data_source.go
      - internal/conn3x/provider/file_resource.go
      - internal/conn3x/provider/schedule_resources.go
      - internal/conn3x/provider/command_resource.go
      - internal/configs/conn3x_circuit.go
      - test/windows/**
      - .github/workflows/windows.yml
  push:
    branches: [main]
    paths:
      - internal/conn3x/modules/windows/**
      - internal/conn3x/transport/ssh/**
      - internal/conn3x/provider/windows_*.go
      - internal/conn3x/provider/host_data_source.go
      - internal/conn3x/provider/file_resource.go
      - internal/conn3x/provider/schedule_resources.go
      - internal/conn3x/provider/command_resource.go
      - internal/configs/conn3x_circuit.go
      - test/windows/**
      - .github/workflows/windows.yml
  # CI's nightly coverage run calls this with cover set, so the Windows
  # steps count toward the total too.
  workflow_call:
    inputs:
      cover:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}-${{ inputs.cover && 'cover' || 'test' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-host:
    # Both Windows Server versions Conn3x supports. A module only leaves
    # experimental once both pass (docs/windows-readiness.md).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    name: windows-host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Start sshd with a pinned host key and a throwaway login key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability -Online -Name 'OpenSSH.Server~~~~0.0.1.0' | Out-Null
          }
          $d = 'C:\ProgramData\ssh'
          New-Item -ItemType Directory -Force $d | Out-Null
          $work = "$env:RUNNER_TEMP\win"
          New-Item -ItemType Directory -Force $work | Out-Null
          & "$env:WINDIR\System32\OpenSSH\ssh-keygen.exe" -q -t ed25519 -N '' -f "$work\admin"
          if ($LASTEXITCODE) { throw 'login key' }
          Remove-Item "$d\ssh_host_*" -Force -ErrorAction SilentlyContinue
          Copy-Item "$work\admin.pub" "$d\administrators_authorized_keys"
          & icacls.exe "$d\administrators_authorized_keys" /inheritance:r /grant '*S-1-5-18:F' /grant '*S-1-5-32-544:F' | Out-Null
          if ($LASTEXITCODE) { throw 'icacls' }
          Set-Service sshd -StartupType Manual
          # With no host keys left, sshd makes its own as it starts.
          Restart-Service sshd
          Add-Content $env:GITHUB_ENV "CONN3X_WIN_HOST=127.0.0.1"
          Add-Content $env:GITHUB_ENV "CONN3X_WIN_USER=$env:USERNAME"
          Add-Content $env:GITHUB_ENV "CONN3X_WIN_KEY=$work\admin"
          Add-Content $env:GITHUB_ENV "CONN3X_WIN_HOST_KEY=$((Get-Content "$d\ssh_host_ed25519_key.pub" -Raw).Trim())"
      - name: Build the binary the plan and apply test drives
        shell: pwsh
        env:
          COVER: ${{ inputs.cover }}
        run: |
          $flags = @()
          if ($env:COVER -eq 'true') {
            # Every run of the binary, and the test itself, writes its
            # counters here for CI's coverage job.
            $flags = '-cover', '-coverpkg=./internal/conn3x/...,./cmd/conn3x/...'
            New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\covdata" | Out-Null
            Add-Content $env:GITHUB_ENV "GOCOVERDIR=$env:RUNNER_TEMP\covdata"
          }
          go build @flags -o "$env:RUNNER_TEMP\conn3x.exe" ./cmd/conn3x
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_ENV "CONN3X_WIN_BIN=$env:RUNNER_TEMP\conn3x.exe"
      - name: Test against the runner
        shell: pwsh
        env:
          COVER: ${{ inputs.cover }}
        run: |
          $flags = @()
          $cargs = @()
          if ($env:COVER -eq 'true') {
            $flags = '-cover', '-coverpkg=./internal/conn3x/...,./cmd/conn3x/...'
            $cargs = '-args', "-test.gocoverdir=$env:GOCOVERDIR"
          }
          go test -tags windowshost -count=1 -timeout 45m -v @flags ./test/windows/ @cargs 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\windows-test.log"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # A missing variable would only skip it, and a skip looks like a pass.
          if (-not (Select-String -LiteralPath "$env:RUNNER_TEMP\windows-test.log" -SimpleMatch -Quiet -- '--- PASS: TestPlanAndApply')) {
            Write-Error 'TestPlanAndApply did not run'
            exit 1
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.cover
        with:
          name: covdata-windows-${{ matrix.os }}
          path: ${{ runner.temp }}/covdata
          retention-days: 3
