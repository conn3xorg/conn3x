name: Windows

# Real PowerShell over real sshd, on GitHub's runner. No reboots: a runner can't
# survive them; those run against a VM by hand.
on:
  pull_request:
    paths:
      - internal/conn3x/modules/windows/**
      - internal/conn3x/transport/ssh/**
      - internal/conn3x/provider/windows_*.go
      - internal/conn3x/provider/host_data_source.go
      - internal/conn3x/provider/file_resource.go
      - internal/conn3x/provider/schedule_resources.go
      - internal/conn3x/provider/command_resource.go
      - internal/configs/conn3x_circuit.go
      - test/windows/**
      - .github/workflows/windows.yml
  push:
    branches: [main]
    paths:
      - internal/conn3x/modules/windows/**
      - internal/conn3x/transport/ssh/**
      - internal/conn3x/provider/windows_*.go
      - internal/conn3x/provider/host_data_source.go
      - internal/conn3x/provider/file_resource.go
      - internal/conn3x/provider/schedule_resources.go
      - internal/conn3x/provider/command_resource.go
      - internal/configs/conn3x_circuit.go
      - test/windows/**
      - .github/workflows/windows.yml

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-host:
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Start sshd with a pinned host key and a throwaway login key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability -Online -Name 'OpenSSH.Server~~~~0.0.1.0' | Out-Null
          }
          $d = 'C:\ProgramData\ssh'
          New-Item -ItemType Directory -Force $d | Out-Null
          $work = "$env:RUNNER_TEMP\win"
          New-Item -ItemType Directory -Force $work | Out-Null
          & "$env:WINDIR\System32\OpenSSH\ssh-keygen.exe" -q -t ed25519 -N '' -f "$work\admin"
          if ($LASTEXITCODE) { throw 'login key' }
          Remove-Item "$d\ssh_host_*" -Force -ErrorAction SilentlyContinue
          Copy-Item "$work\admin.pub" "$d\administrators_authorized_keys"
          & icacls.exe "$d\administrators_authorized_keys" /inheritance:r /grant '*S-1-5-18:F' /grant '*S-1-5-32-544:F' | Out-Null
          if ($LASTEXITCODE) { throw 'icacls' }
          Set-Service sshd -StartupType Manual
          # With no host keys left, sshd makes its own as it starts.
          Restart-Service sshd
          Add-Content $env:GITHUB_ENV "CONN3X_WIN_HOST=127.0.0.1"
          Add-Content $env:GITHUB_ENV "CONN3X_WIN_USER=$env:USERNAME"
          Add-Content $env:GITHUB_ENV "CONN3X_WIN_KEY=$work\admin"
          Add-Content $env:GITHUB_ENV "CONN3X_WIN_HOST_KEY=$((Get-Content "$d\ssh_host_ed25519_key.pub" -Raw).Trim())"
      - name: Build the binary the plan and apply test drives
        shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP\conn3x.exe" ./cmd/conn3x
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_ENV "CONN3X_WIN_BIN=$env:RUNNER_TEMP\conn3x.exe"
      - name: Test against the runner
        shell: pwsh
        run: |
          go test -tags windowshost -count=1 -timeout 45m -v ./test/windows/ 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\windows-test.log"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # A missing variable would only skip it, and a skip looks like a pass.
          if (-not (Select-String -LiteralPath "$env:RUNNER_TEMP\windows-test.log" -SimpleMatch -Quiet -- '--- PASS: TestPlanAndApply')) {
            Write-Error 'TestPlanAndApply did not run'
            exit 1
          }
