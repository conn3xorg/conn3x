#
# Releases are cut by .github/workflows/release.yml, which runs this as a
# draft that a maintainer reviews and publishes. Try it locally with
#   goreleaser release --snapshot --clean
version: 2
project_name: conn3x

before:
  hooks:
    # The branding and pruning overlay that scripts/build-conn3x.sh uses.
    # It goes under tmp/, which git ignores, so the release still sees a
    # clean checkout. A fixed name in /tmp could be claimed first by another
    # user of a shared build machine, who would then choose the sources.
    - sh -c 'rm -rf tmp/overlay && env -u GOOS -u GOARCH go run ./internal/conn3x/brand/brandgen -root . -out tmp/overlay >/dev/null'
    # The host agents conn3x embeds, built for Linux whatever the target.
    - env -u GOOS -u GOARCH bash scripts/build-agent.sh
    # A release without them would quietly run everything over the shell.
    - env -u GOOS -u GOARCH CONN3X_REQUIRE_AGENT=1 go test -count=1 -run TestEmbeddedPresent ./internal/conn3x/agent/

builds:
  - id: conn3x
    main: ./cmd/conn3x
    binary: conn3x
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
      - -overlay=tmp/overlay/overlay.json
    ldflags:
      - -s -w -X github.com/opentofu/opentofu/internal/conn3x/version.Version={{ .Version }} -X github.com/opentofu/opentofu/version.dev=no
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md

# A .deb and an .rpm for each Linux build, so `apt install ./…deb` and
# `dnf install ./…rpm` work. They go in checksums.txt, which cosign signs,
# and the release workflow attests them like the archives. The packages
# themselves aren't signed with a key yet; that comes with a repository to
# install from.
nfpms:
  - id: packages
    ids: [conn3x]
    package_name: conn3x
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: The Conn3x Authors
    homepage: https://conn3x.org
    maintainer: The Conn3x Authors <security@conn3x.org>
    description: One plan for your cloud and the servers it creates.
    license: MPL-2.0
    formats: [deb, rpm]
    bindir: /usr/bin
    mtime: "{{ .CommitDate }}"
    contents:
      - src: LICENSE
        dst: /usr/share/doc/conn3x/LICENSE
        file_info: { mode: 0644, mtime: "{{ .CommitDate }}" }
      - src: NOTICE
        dst: /usr/share/doc/conn3x/NOTICE
        file_info: { mode: 0644, mtime: "{{ .CommitDate }}" }
      - src: README.md
        dst: /usr/share/doc/conn3x/README.md
        file_info: { mode: 0644, mtime: "{{ .CommitDate }}" }
      # Where Debian looks for the licence, and the one file under
      # /usr/share/doc that Ubuntu's minimal images keep.
      - src: LICENSE
        dst: /usr/share/doc/conn3x/copyright
        packager: deb
        file_info: { mode: 0644, mtime: "{{ .CommitDate }}" }

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive
  # syft doesn't look inside a .deb or an .rpm, so it would list the
  # package and none of the modules in it. Each package holds the binary
  # that's in the archive for its architecture, so that archive is what's
  # scanned, under the package's name.
  - id: packages
    artifacts: package
    args:
      - "{{ .ProjectName }}_{{ .Version }}_linux_{{ .Arch }}.tar.gz"
      - "--source-name=${artifact}"
      - "--output=spdx-json=${document}"
      - "--enrich=all"

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]
    artifacts: checksum

# Keyless, as for checksums.txt: the signature names the release workflow
# and is stored in the registry beside the image.
docker_signs:
  - cmd: cosign
    args: ["sign", "${artifact}@${digest}", "--yes"]

dockers_v2:
  - images:
      - ghcr.io/conn3xorg/conn3x
    tags:
      - "v{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    dockerfile: release.Containerfile
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: conn3x
      org.opencontainers.image.description: One plan for your cloud and the servers it creates.
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.licenses: MPL-2.0

homebrew_casks:
  - name: conn3x
    repository:
      owner: conn3xorg
      name: homebrew-tap
      # Token fields only expand .Env, not template functions.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://conn3x.org
    description: One plan for your cloud and the servers it creates.
    license: MPL-2.0
    hooks:
      post:
        # The binary is not notarised by Apple; let Gatekeeper run it.
        install_steps: |
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/conn3x"]

scoops:
  - name: conn3x
    repository:
      owner: conn3xorg
      name: scoop-bucket
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://conn3x.org
    description: One plan for your cloud and the servers it creates.
    license: MPL-2.0
    skip_upload: auto

# Opens a pull request on microsoft/winget-pkgs from James's fork; the
# package's moderators merge it.
winget:
  - name: conn3x
    package_identifier: Conn3x.Conn3x
    package_name: Conn3x
    publisher: Conn3x
    publisher_url: https://conn3x.org
    publisher_support_url: https://github.com/conn3xorg/conn3x/issues
    author: The Conn3x Authors
    homepage: https://conn3x.org
    short_description: One plan for your cloud and the servers it creates.
    description: Conn3x creates cloud infrastructure and configures the servers on it in one plan and one apply. It is built on OpenTofu, so Terraform and OpenTofu providers work unchanged, and it adds steps for packages, files, users, services and Windows settings, run over SSH.
    license: MPL-2.0
    license_url: https://github.com/conn3xorg/conn3x/blob/main/LICENSE
    copyright: Copyright (c) The Conn3x Authors
    release_notes_url: "https://github.com/conn3xorg/conn3x/releases/tag/{{ .Tag }}"
    tags: [configuration-management, iac, infrastructure-as-code, opentofu, terraform, windows-server]
    skip_upload: auto
    repository:
      owner: jamesconwaydev
      name: winget-pkgs
      branch: "Conn3x.Conn3x-{{ .Version }}"
      token: "{{ .Env.WINGET_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

changelog:
  sort: asc
  use: github
  format: "{{ .Message }}"
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: true
  replace_existing_draft: true
  footer: |
    Verify a download:

    ```sh
    cosign verify-blob \
      --certificate-identity 'https://github.com/conn3xorg/conn3x/.github/workflows/release.yml@refs/heads/main' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      --bundle checksums.txt.sigstore.json checksums.txt
    sha256sum --check --ignore-missing checksums.txt
    ```

    Verify the container image:

    ```sh
    cosign verify ghcr.io/conn3xorg/conn3x:v{{ .Version }} \
      --certificate-identity 'https://github.com/conn3xorg/conn3x/.github/workflows/release.yml@refs/heads/main' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    ```
