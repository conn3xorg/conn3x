// The messages between conn3x and the agent on a host. Each one travels as
// a frame: a four-byte big-endian length, then an Envelope. agentpb.go
// encodes them by hand with protowire, field for field as written here.
syntax = "proto3";

package conn3x.agent.v1;

option go_package = "github.com/opentofu/opentofu/internal/conn3x/agent/agentpb";

message Envelope {
  // id ties a response to its request. Hello uses 0.
  uint64 id = 1;
  oneof body {
    Hello hello = 2;
    ExecRequest exec_request = 3;
    ExecResponse exec_response = 4;
    Cancel cancel = 5;
    Error error = 6;
    ReadFileRequest read_file = 7;
    FileStat file = 8;
    ReadUnitRequest read_unit = 9;
    UnitProps unit = 10;
  }
}

// Hello is the first frame the agent sends.
message Hello {
  uint32 version = 1;
}

// ExecRequest runs cmd with /bin/sh in the C locale.
message ExecRequest {
  string cmd = 1;
  bytes stdin = 2;
}

message ExecResponse {
  bytes stdout = 1;
  bytes stderr = 2;
  int32 exit_code = 3;
}

// Cancel kills the request with the same id, and everything it started.
message Cancel {}

message Error {
  enum Code {
    CODE_UNSPECIFIED = 0;
    UNSUPPORTED = 1;
    INTERNAL = 2;
    CANCELED = 3;
  }
  Code code = 1;
  string message = 2;
}

// ReadFileRequest asks for a file the way file.Read's shell command sees
// it. The agent answers with FileStat, or UNSUPPORTED when it can't match
// the shell exactly, such as an owner with no name in /etc/passwd.
message ReadFileRequest {
  string path = 1;
}

message FileStat {
  bool exists = 1;   // the path exists, or is a symlink
  bool regular = 2;  // it is a regular file, following symlinks
  uint32 mode = 3;   // the path's own permission bits, as stat %a
  string owner = 4;  // the path's own owner and group
  string group = 5;
  bytes content = 6; // following symlinks
}

// ReadUnitRequest asks systemd, over D-Bus, for a unit's properties. The
// agent answers with UnitProps, or UNSUPPORTED without D-Bus.
message ReadUnitRequest {
  string unit = 1;
}

message UnitProps {
  // As "systemctl show" prints them; booleans are yes or no.
  map<string, string> props = 1;
}
