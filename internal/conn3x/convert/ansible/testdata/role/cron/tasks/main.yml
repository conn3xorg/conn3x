---
- name: Include OS-specific variables.
  include_vars: "{{ ansible_facts.os_family }}.yml"

- name: Install cron.
  package:
    name: "{{ cron_package }}"
    state: present

- name: Write the cron defaults file.
  copy:
    dest: "{{ cron_defaults_file }}"
    content: "# Managed by the cron role\n"
    mode: "0644"

- name: Start cron.
  service:
    name: "{{ cron_service }}"
    state: started
    enabled: true
